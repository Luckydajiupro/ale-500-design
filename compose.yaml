name: ale500

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ale500}
      POSTGRES_USER: ${POSTGRES_USER:-ale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ale_local_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ale} -d ${POSTGRES_DB:-ale500}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - ale500

  migrate:
    build: .
    command: ["python", "platform/manage.py", "migrate"]
    environment:
      ALE_DB_URL: postgresql://${POSTGRES_USER:-ale}:${POSTGRES_PASSWORD:-ale_local_dev}@db:5432/${POSTGRES_DB:-ale500}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ale500

  web:
    build: .
    command: ["python", "platform/run.py"]
    environment:
      ALE_DB_URL: postgresql://${POSTGRES_USER:-ale}:${POSTGRES_PASSWORD:-ale_local_dev}@db:5432/${POSTGRES_DB:-ale500}
      ALE_STORAGE_ROOT: /data/objects
      ALE_PACKAGE_ROOT: /data/packages
      ALE_SECRET_PATH: /data/session.key
      ALE_HOST: 0.0.0.0
      ALE_PORT: 8080
      ALE_SEED_PASSWORD: ${ALE_SEED_PASSWORD:-AleDemo123!}
      ALE_ENV: local
      ALE_ALLOW_DEMO_SEED: "1"
      ALE_MODEL_PROVIDER: ${ALE_MODEL_PROVIDER:-mock}
      ALE_MODEL_BASE_URL: ${ALE_MODEL_BASE_URL:-}
      ALE_MODEL_ID: ${ALE_MODEL_ID:-mock-deterministic}
      ALE_MODEL_STRUCTURED_OUTPUT: ${ALE_MODEL_STRUCTURED_OUTPUT:-none}
      ALE_MODEL_SECRET_FILE: /run/secrets/model_api_key
      ALE_MODEL_PROMPT_VERSION: ${ALE_MODEL_PROMPT_VERSION:-agent-v1}
    secrets:
      - source: model_api_key
        target: model_api_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - objects:/data/objects
      - packages:/data/packages
      - runtime:/data/run
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ale500

  worker:
    build: .
    command: ["python", "platform/worker.py", "--loop"]
    environment:
      ALE_DB_URL: postgresql://${POSTGRES_USER:-ale}:${POSTGRES_PASSWORD:-ale_local_dev}@db:5432/${POSTGRES_DB:-ale500}
      ALE_STORAGE_ROOT: /data/objects
      ALE_PACKAGE_ROOT: /data/packages
      ALE_SECRET_PATH: /data/session.key
      ALE_WORKER_ID: compose-worker
      ALE_ENV: local
      ALE_ALLOW_DEMO_SEED: "1"
      ALE_MODEL_PROVIDER: ${ALE_MODEL_PROVIDER:-mock}
      ALE_MODEL_BASE_URL: ${ALE_MODEL_BASE_URL:-}
      ALE_MODEL_ID: ${ALE_MODEL_ID:-mock-deterministic}
      ALE_MODEL_STRUCTURED_OUTPUT: ${ALE_MODEL_STRUCTURED_OUTPUT:-none}
      ALE_MODEL_SECRET_FILE: /run/secrets/model_api_key
      ALE_MODEL_PROMPT_VERSION: ${ALE_MODEL_PROMPT_VERSION:-agent-v1}
    secrets:
      - source: model_api_key
        target: model_api_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - objects:/data/objects
      - packages:/data/packages
      - runtime:/data/run
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ale500

secrets:
  model_api_key:
    file: ${ALE_MODEL_SECRET_FILE_HOST:-./.secrets/model_api_key}

networks:
  ale500:
    name: ale500_net

volumes:
  pgdata:
    name: ale500_pgdata
  objects:
    name: ale500_objects
  packages:
    name: ale500_packages
  runtime:
    name: ale500_runtime
